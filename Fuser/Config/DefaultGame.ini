[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Fuser

[/Script/UnrealEd.ProjectPackagingSettings]
; FDS's blueprint stubs are referenced by config / class defaults; cook them explicitly.
+DirectoriesToAlwaysCook=(Path="/Game/GameFramework")
; Empty level stubs under the names clients stream (FDSCreateMaps -mapsfile=FDSVenueSublevels-<venue>.txt); the server
; must own every level a client reports visible.
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Gameplay")

[/Script/FuserServer.FDSLobby]
; Set length and DJ slots. MaxNumDJsInSession as FUSER HypeMultiplayerSettings. Rounds / turn measures: the shortest
; official session (1 round, 32-bar turns); FDS_ROUNDS / FDS_TURN_MEASURES (1-3 x 32/64/128) replace them, other values
; are ignored with a warning.
CoopRounds=1
CoopTurnMeasures=32
MaxNumDJsInSession=4
; Outside the Main Stage the set length starts unset, as on a FUSER host, so the session creator's client sends its own
; choice (1-3 rounds of 32/64/128 bars; the client only sends it while the length is unset). CoopRounds /
; CoopTurnMeasures apply when no choice arrives within SetLengthWaitSeconds of the first join, or at the countdown. A
; public session keeps its ticket's rounds and takes only the turn length. The length is unset again when the server
; empties. False: CoopRounds / CoopTurnMeasures are set at start and the clients send nothing (FDS's old behaviour).
PlayerChosenSetLength=True
SetLengthWaitSeconds=8
; Everyone ready in the Lobby starts the countdown (lobby completion on the leader). A countdown is cancelled when no
; DJ is left (un-readying does not cancel it), and a set still in its turns returns to the Lobby when its last DJ leaves
; (private sessions; a Main Stage set runs out to its results).
; A viewer who joined while every DJ slot was taken becomes a DJ, in join order, once a slot is free in an idle Lobby.
; With fuserd session tokens a player without a hype user id never DJs or leads, and keeps its token-checked id.
AutoStart=True
; Public sessions only: FUSER's timed lobby start (MPS slot 146, compiled out of the shipping build). With
; PublicLobbyTimerMinDJs DJs queued the Lobby counts down PublicLobbyTimerSeconds (to a bar start) and the set starts
; even if not everyone is ready; everyone ready cuts it to 5 s. Fewer DJs before everyone is ready cancels it.
; False: public lobbies start only when everyone is ready.
PublicLobbyTimer=True
PublicLobbyTimerSeconds=60
PublicLobbyTimerMinDJs=2
; Back from a set, DJs are moved to viewers and restored after 1 s so clients rebuild their DJ queues: the lobby DJ
; characters only reappear on a queue change. False keeps the DJs untouched.
RefreshDJsAfterSet=True
; After Results, FUSER's Results_XPPayout stage: 30 s, or until every DJ is ready in the results. False: Results goes
; straight back to the Lobby.
ResultsXPPayout=True
; A set with only one player in the session skips the hottest-mix stages (FUSER's no-winner collapse: Results moves up
; and the player's mix plays on into the Lobby). False runs them as for any set.
SkipHottestMixWhenSolo=True
; A set where no bar scored (no reactions or snapshots on a measure with a recorded mix) skips the hottest-mix stages
; (FUSER's behaviour: Results moves up and the last mix plays on into the Lobby). False keeps the stages with an empty
; hottest mix.
CollapseHottestMixWithoutWinner=True
; Hottest-mix replay length. True: entering HottestMixPlayback, the replay lasts round(BPM x HottestMixPlaybackSeconds
; / 240) bars at the hottest mix's tempo and the later stages move with it (the Steam build's ServerEnterStage rule; not
; confirmed in the EGS build). False: FUSER's PerStageMeasureCount, 6 bars at any tempo. HottestMixPlaybackSeconds is
; the replay camera's time, clamped to 1-60.
FitHottestMixToBpm=False
HottestMixPlaybackSeconds=12
; Owner-only _serverAccessState for joining players: Private or Public.
ServerAccessState=Private
; AFK kick (reason afk_dj) as FUSER HypeMultiplayerSettings: idle seconds by co-op turn measures, else the default.
AfkSecondsTillKick=((32, 600),(64, 900),(128, 1200))
AfkSecondsTillKickDefault=600
EnableAfkChecks=True
; With fuserd: a SpawnDisc of a custom song fuserd lists as not loaded by every player in the session (blocked_songs in
; its register / status replies) is not relayed, nor put in a late joiner's snapshot; a client lacking the song would
; otherwise stall on that DJ's actions. False relays every disc.
BlockUnreadyCustomSongs=True

[/Script/Engine.GameSession]
; Session capacity: FUSER HypeMultiplayerSettings MaxPlayersInFreestyle (12, DJs and viewers together; MaxNumDJsInSession
; limits the DJs). A join beyond it is refused by the stock AGameSession::ApproveLogin ("Server full.").
MaxPlayers=12

[/Script/FuserServer.FDSInstall]
; A FUSER install mounted read-only (FDS_FUSER_ROOT / -FDSFuserRoot=, key in FDS_PAK_KEY).
; Its paks mount below FDS's own pak. FDS loads an install package only when its path starts with an AllowLoad prefix;
; everything else a client references keeps a placeholder. Package existence (streamed sublevels) needs no load.
PakPattern=pakchunk*-WindowsNoEditor.pak
; The venue catalogue (VenueData) is read from the install too.
